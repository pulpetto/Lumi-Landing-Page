<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi - Bible for Short Attention Span</title>
    <link rel="icon" type="image/svg+xml" href="assets/app_icon.svg">
    <meta name="description" content="Lumi: Learn about the story and see how it relates to you.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#00D9FF',
                        darkBg: '#182130',
                    },
                    fontFamily: {
                        nunito: ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #182130;
            color: #ffffff;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center overflow-x-hidden selection:bg-brand selection:text-darkBg">

    <!-- Top App Bar -->
    <header class="w-full flex justify-center items-center py-8">
        <img src="assets/silhouette.svg" alt="Lumi Silhouette" class="h-7 w-7 mr-2">
        <h1 class="text-3xl font-extrabold tracking-wide text-brand">Lumi</h1>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center w-full px-6 text-center max-w-5xl mx-auto">

        <!-- Phones Image -->
        <div class="mt-4 mb-10 w-full max-w-[280px] sm:max-w-sm md:max-w-md relative">
            <div class="absolute inset-0 bg-brand/20 blur-[100px] rounded-full z-0 pointer-events-none"></div>
            <img src="assets/phones.png" alt="Lumi App Screenshots" class="w-full h-auto relative z-10 drop-shadow-2xl">
        </div>

        <!-- Headline -->
        <h2 class="text-4xl md:text-5xl font-black mb-12 leading-tight tracking-tight max-w-2xl">
            Bible for Short Attention Span.
        </h2>

        <!-- Store Buttons -->
        <div class="flex flex-row gap-3 sm:gap-4 mb-16 w-full max-w-lg justify-center mx-auto">
            <!-- App Store Button -->
            <a href="#"
                class="flex flex-1 items-center justify-center bg-black text-white border border-gray-700 px-2 sm:px-5 py-2.5 rounded-2xl hover:bg-gray-800 active:scale-95 active:opacity-80 transition shadow-xl group">
                <svg class="w-6 h-6 sm:w-8 sm:h-8 mr-2 sm:mr-3 group-hover:scale-105 transition-transform"
                    viewBox="0 0 384 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
                </svg>
                <div class="text-left">
                    <div class="text-[11px] leading-[1] font-semibold tracking-wide text-gray-300">Download on the</div>
                    <div class="text-[20px] font-bold leading-[1.1] mt-0.5">App Store</div>
                </div>
            </a>

            <!-- Google Play Button -->
            <a href="#"
                class="flex flex-1 items-center justify-center bg-black text-white border border-gray-700 px-2 sm:px-5 py-2.5 rounded-2xl hover:bg-gray-800 active:scale-95 active:opacity-80 transition shadow-xl group">
                <svg class="w-5 h-5 sm:w-7 sm:h-7 mr-2 sm:mr-3.5 ml-0.5 sm:ml-1 group-hover:scale-105 transition-transform"
                    viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                    <path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1z" fill="#34A853" />
                    <path d="M47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0z"
                        fill="#4285F4" />
                    <path d="M472.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8z"
                        fill="#FBBC04" />
                    <path d="M104.6 499l280.8-161.2-60.1-60.1L104.6 499z" fill="#EA4335" />
                </svg>
                <div class="text-left">
                    <div class="text-[11px] leading-[1] font-semibold tracking-wide text-gray-300">GET IT ON</div>
                    <div class="text-[19px] font-bold leading-[1.1] mt-0.5">Google Play</div>
                </div>
            </a>
        </div>

        <!-- Text Bubble -->
        <div
            class="relative bg-[#1E293B] text-white border border-[#334155] text-lg md:text-xl font-bold px-8 py-5 rounded-3xl mb-4 max-w-sm mx-auto">
            Learn about the Bible stories and see how they relate to you!
            <!-- Bubble arrow border (outer) -->
            <div
                class="absolute w-0 h-0 border-l-[15px] border-r-[15px] border-t-[17px] border-l-transparent border-r-transparent border-t-[#334155] left-1/2 transform -translate-x-1/2 -bottom-[17px]">
            </div>
            <!-- Bubble arrow (inner) -->
            <div
                class="absolute w-0 h-0 border-l-[14px] border-r-[14px] border-t-[16px] border-l-transparent border-r-transparent border-t-[#1E293B] left-1/2 transform -translate-x-1/2 -bottom-[15px]">
            </div>
        </div>

        <!-- Pointing Up SVG -->
        <div class="mt-4 mb-16">
            <img src="assets/pointing_up.svg" alt="Pointing up to the bubble" class="w-48 h-48 object-contain">
        </div>

    </main>

    <!-- Footer -->
    <footer
        class="w-full flex flex-col sm:flex-row justify-center items-center gap-6 py-10 pb-16 text-sm text-gray-400 border-t border-gray-800">
        <a href="#" class="hover:text-brand transition-colors duration-200">Privacy Policy</a>
        <a href="#" class="hover:text-brand transition-colors duration-200">Terms of Service</a>
        <a href="mailto:support@thelumi.app"
            class="hover:text-brand transition-colors duration-200 font-semibold text-gray-300">support@thelumi.app</a>
    </footer>

</body>

</html>
